{% extends "admin/base.html" %}
{% block title %}Settings - KOFIKIOSK Admin{% endblock %}
{% block heading %}Settings{% endblock %}
{% block content %}

<div class="admin-card">
  <form method="POST">
    <div class="form-row">
      <label for="tax_rate">Tax Rate (decimal, e.g. 0.12 for 12% VAT, 0 for none)</label>
      <input type="number" step="0.01" min="0" max="1" id="tax_rate" name="tax_rate" value="{{ tax_rate }}">
    </div>
    <button type="submit" class="btn btn-primary">Save Settings</button>
  </form>
</div>
{% endblock %}
